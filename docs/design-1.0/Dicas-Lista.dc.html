<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<title>Elphy — todas as dicas</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Big+Shoulders+Display:wght@700;800;900&amp;family=Schibsted+Grotesk:wght@400;500;600;700;800&amp;family=Martian+Mono:wght@400;500;700&amp;display=swap">
<style>
body{margin:0;background:#050607}
a{color:#eef2ee}a:hover{color:#9dff3b}
button{cursor:pointer}
button:focus-visible,a:focus-visible,input:focus-visible,textarea:focus-visible{outline:2px solid #9dff3b;outline-offset:3px}
.el-rolo{scrollbar-width:none}.el-rolo::-webkit-scrollbar{display:none}
.el-col>*{flex-shrink:0}
@keyframes el-imprime{from{transform:translateY(-46px);clip-path:inset(0 0 100% 0)}to{transform:none;clip-path:inset(0 0 0 0)}}
@keyframes el-linha{from{opacity:0;transform:translateY(-5px)}to{opacity:1;transform:none}}
@keyframes el-carimba{0%{opacity:0;transform:scale(1.6) rotate(-10deg)}62%{opacity:1;transform:scale(.93) rotate(15deg)}100%{opacity:1;transform:scale(1) rotate(12deg)}}
@keyframes el-pulso{0%,100%{opacity:.4}50%{opacity:1}}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</helmet>
<div class="el-col" style="position: relative; width: 390px; height: 1760px; overflow: hidden; display: flex; flex-direction: column; background: #050607; color: #eef2ee; font-family: 'Schibsted Grotesk', system-ui, sans-serif;">
<header style="display: flex; align-items: center; justify-content: space-between; height: 64px; box-sizing: border-box; padding: 0 24px; border-bottom: 1px solid rgba(255,255,255,.07);">
  <a href="Home-Mobile.dc.html" style="font-weight: 800; font-size: 24px; letter-spacing: -.045em; text-decoration: none; color: #eef2ee;">elphy<span style="color: #9dff3b;">.</span></a>
  <div style="display: flex; align-items: center; gap: 12px;">
    <span style="font-family: 'Martian Mono', monospace; font-size: 10.5px; letter-spacing: .12em; text-transform: uppercase; color: #c9d0ca;">Dicas</span>
    <a href="Menu-Mobile.dc.html" aria-label="Abrir menu" style="width: 44px; height: 44px; box-sizing: border-box; border: 1px solid rgba(255,255,255,.14); border-radius: 22px; display: flex; align-items: center; justify-content: center;"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#eef2ee" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M4 8h16M4 16h16"></path></svg></a>
  </div>
</header>
<div style="padding: 28px 24px 0;">
  <p style="margin: 0; font-family: 'Martian Mono', monospace; font-size: 11px; letter-spacing: .16em; text-transform: uppercase; color: #9dff3b;">Duas por semana</p>
  <h1 style="margin: 14px 0 0; font-family: 'Big Shoulders Display', sans-serif; font-weight: 900; font-size: 70px; line-height: .86; text-transform: uppercase;">Dicas<br>sem caô<span style="color: #9dff3b;">.</span></h1>
  <p style="margin: 14px 0 0; font-size: 16px; line-height: 24px; color: #b9c1bb;">Cada dica termina numa conta que você refaz com as suas peças.</p>
</div>
<div class="el-rolo" style="overflow-x: auto; margin-top: 28px;">
  <div style="display: flex; gap: 8px; padding: 0 24px; width: max-content;">
    <sc-for list="{{ deps }}" as="d" hint-placeholder-count="5">
      <button type="button" onClick="{{ d.pick }}" aria-pressed="{{ d.on }}" style="height: 44px; padding: 0 18px; border-radius: 22px; border: 1px solid {{ d.bd }}; background: {{ d.bg }}; color: {{ d.fg }}; font: inherit; font-size: 14px; font-weight: 700; white-space: nowrap;">{{ d.nome }}</button>
    </sc-for>
  </div>
</div>
<div style="padding: 20px 24px 0; font-family: 'Martian Mono', monospace; font-size: 10.5px; letter-spacing: .14em; text-transform: uppercase; color: #9aa39c;">{{ total }}</div>
<div style="padding: 10px 24px 0; display: flex; flex-direction: column;">
  <sc-for list="{{ dicas }}" as="d" hint-placeholder-count="10">
    <a href="Dica-Mobile.dc.html" style="display: flex; justify-content: space-between; align-items: center; gap: 16px; padding: 18px 0; border-top: 1px solid rgba(255,255,255,.08); text-decoration: none;">
      <span style="display: flex; flex-direction: column; gap: 6px;">
        <span style="font-family: 'Martian Mono', monospace; font-size: 10px; letter-spacing: .12em; text-transform: uppercase; color: #9aa39c;">{{ d.dep }} · {{ d.ferr }}</span>
        <span style="font-size: 17px; line-height: 23px; font-weight: 700;">{{ d.t }}</span>
      </span>
      <span style="font-family: 'Big Shoulders Display', sans-serif; font-weight: 900; font-size: 30px; color: {{ d.cor }}; white-space: nowrap;">{{ d.m }}</span>
    </a>
  </sc-for>
</div>
<div style="flex-grow: 1; min-height: 40px;"></div>
<footer style="padding: 24px; border-top: 1px solid rgba(255,255,255,.07); display: flex; justify-content: space-between; align-items: center; font-family: 'Martian Mono', monospace; font-size: 10px; letter-spacing: .1em; text-transform: uppercase; color: #9aa39c;">
  <span>Dica sem caô<span style="color: #9dff3b;">.</span></span>
  <a href="Metodologia-Mobile.dc.html" style="color: #9aa39c;">Como a gente faz a conta</a>
</footer>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":1760}}'>
class Component extends DCLogic {
  constructor(props) {
    super(props);
    this.D = [{"dep": "PC", "ferr": "Fonte", "t": "A RTX 5070 puxa 250 W. A caixa não conta o resto.", "m": "550 W", "cor": "#9dff3b"}, {"dep": "PC", "ferr": "Fonte", "t": "A conta da fonte arredonda para cima. O pico da placa explica.", "m": "×1,3", "cor": "#ffb020"}, {"dep": "PC", "ferr": "Fonte", "t": "O selo 80 Plus mede eficiência. Proteção fica de fora.", "m": "80+", "cor": "#9dff3b"}, {"dep": "Celular", "ferr": "Power bank", "t": "O power bank de 20.000 mAh dá 2,5 cargas, não 4.", "m": "2,5", "cor": "#9dff3b"}, {"dep": "Celular", "ferr": "Power bank", "t": "O mAh da caixa conta a célula, não o que sai na USB.", "m": "3,7 V", "cor": "#ffb020"}, {"dep": "Tela e armazenamento", "ferr": "SSD", "t": "O SSD de 1 TB mostra 931 GB. Ninguém levou os 69.", "m": "931", "cor": "#9dff3b"}, {"dep": "Casa", "ferr": "Conta de luz", "t": "O PC gamer cobra na conta de luz o que a loja não mostra.", "m": "kWh", "cor": "#ffb020"}, {"dep": "Tela e armazenamento", "ferr": "Monitor", "t": "O monitor de 27\" Full HD mostra o pixel na distância da mesa.", "m": "82 PPI", "cor": "#9dff3b"}, {"dep": "PC", "ferr": "Gabinete", "t": "A placa passa na ficha do gabinete e trava na ventoinha.", "m": "mm", "cor": "#ffb020"}, {"dep": "PC", "ferr": "Memória", "t": "O Ryzen 5000 só aceita DDR4. A DDR5 nem encaixa.", "m": "DDR4", "cor": "#9dff3b"}];
    this.state = { dep: 'Todas' };
  }
  renderVals() {
    var self = this, s = this.state;
    var lista = this.D.filter(function (d) { return s.dep === 'Todas' || d.dep === s.dep; });
    return {
      deps: ['Todas', 'PC', 'Celular', 'Tela e armazenamento', 'Casa'].map(function (n) {
        var on = s.dep === n;
        return { nome: n, on: on, pick: function () { self.setState({ dep: n }); },
          bg: on ? '#9dff3b' : '#0d1013', bd: on ? '#9dff3b' : 'rgba(255,255,255,.1)', fg: on ? '#07110a' : '#eef2ee' };
      }),
      dicas: lista, total: lista.length + (lista.length === 1 ? ' dica' : ' dicas')
    };
  }
}
</script>
</body>
</html>
